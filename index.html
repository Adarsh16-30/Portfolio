<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adarsh Tripathi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="Adarsh Tripathi's interactive terminal portfolio website. Explore my projects, experience, skills, and resume." />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://adarsh-tripathi.vercel.app/" />
  <meta property="og:title" content="Adarsh Tripathi — Portfolio" />
  <meta property="og:description" content="Adarsh Tripathi's interactive terminal portfolio website. Explore my projects, experience, skills, and resume." />
  <meta property="og:image" content="https://adarsh-tripathi.vercel.app/og-image.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://adarsh-tripathi.vercel.app/" />
  <meta name="twitter:title" content="Adarsh Tripathi — Portfolio" />
  <meta name="twitter:description" content="Adarsh Tripathi's interactive terminal portfolio website. Explore my projects, experience, skills, and resume." />
  <meta name="twitter:image" content="https://adarsh-tripathi.vercel.app/og-image.jpg" />
  <meta name="theme-color" content="#1a1f36" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Background = macOS desktop wallpaper (dock + profile card baked in) -->
    <div class="bg-desktop" id="bg-desktop"></div>

    <div class="desktop-shell" aria-hidden="true">
      <div class="desktop-menu-bar">
        <div class="desktop-menu-left">
          <span class="desktop-apple"></span>
          <span>Finder</span>
          <span>File</span>
          <span>Edit</span>
          <span>View</span>
          <span>Go</span>
          <span>Window</span>
          <span>Help</span>
        </div>
        <div class="desktop-menu-right">
          <span>Tue 9:41 AM</span>
          <span>◔</span>
          <span>◫</span>
          <span>⌕</span>
        </div>
      </div>

      <div class="desktop-card">
        <div class="desktop-card-avatar"></div>
        <div class="desktop-card-name">Adarsh Tripathi</div>
        <button class="desktop-card-button" type="button">Explore Profile</button>
      </div>

      <div class="desktop-dock">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <canvas id="matrix-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>
    <div class="scanlines"></div>

    <!-- Terminal Window -->
    <div class="terminal booting" id="terminal">
      <div class="title-bar" id="title-bar">
        <div class="traffic-lights">
          <button class="dot dot-red" id="btn-close" title="Close"></button>
          <button class="dot dot-yellow" id="btn-minimize" title="Minimize"></button>
          <button class="dot dot-green" id="btn-maximize" title="Maximize"></button>
        </div>
        <span class="title-text" id="title-text">adarsh@portfolio ~ /portfolio</span>
      </div>

      <div class="terminal-body" id="terminal-body">
        <div class="output" id="output"></div>
      </div>

      <div class="input-bar" id="input-bar">
        <span class="prompt">&gt;</span>
        <input
          type="text"
          id="command-input"
          class="command-input"
          placeholder='Type a command... try "/help"'
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
